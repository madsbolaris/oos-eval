name: Validate Kev data

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify generated partitions
        run: python scripts/build_kev_dataset.py --check
      - name: Generate full CLINC150 intent benchmark
        run: >-
          python scripts/build_kev_dataset.py
          --spec benchmarks/clinc150-intent/model.json
          --output '${{ runner.temp }}/clinc150-intent'
